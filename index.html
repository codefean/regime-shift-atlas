<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore countries and their maritime zones on an interactive world map.">
  <title>Regime Shift Atlas</title>

  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://tile.openstreetmap.org">
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >
  <link rel="stylesheet" href="styles.css">
</head>
<body class="atlas-embed-page">
  <main>
    <section id="world-map" class="map-shell">

      <div class="map-mobile-tools">
        <button id="map-interaction-toggle" class="map-interaction-toggle" type="button" aria-pressed="false" hidden>Explore map</button>
        <span class="map-touch-help">On mobile, tap a country once to select it and again to open its profile.</span>
      </div>

      <div id="map" aria-label="Interactive world map. Hover or tap a country to view its regime-shift profile."></div>

      <div id="mobile-country-action" class="mobile-country-action" hidden aria-live="polite">
        <div>
          <span class="mobile-country-action-label">Selected country</span>
          <strong id="mobile-country-name"></strong>
        </div>
        <div class="mobile-country-action-buttons">
          <button id="mobile-country-clear" class="map-action-secondary" type="button">Clear</button>
          <button id="mobile-country-open" class="map-action-primary" type="button">Open profile</button>
        </div>
      </div>

      <div class="map-footnote">
        <span>Regime Shift Database | Stockholm Resilience Centre</span>
    </section>

  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="atlas-config.js"></script>
  <script src="regime-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
